<style>.gc-views{margin:1em 0 0;color:#666;font-size:.9em}.gc-total{margin:0 0 1.25em;color:#666;font-size:.95em}</style>
<script data-goatcounter="https://3draven.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
(function () {
  function setCount(el, path) {
    fetch('https://3draven.goatcounter.com/counter/' + encodeURIComponent(path) + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error(String(r.status));
        return r.json();
      })
      .then(function (data) {
        el.textContent = (data && data.count != null) ? data.count : '0';
      })
      .catch(function () {
        el.textContent = '0';
      });
  }
  function run() {
    document.querySelectorAll('[data-gc-path]').forEach(function (el) {
      setCount(el, el.getAttribute('data-gc-path'));
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
