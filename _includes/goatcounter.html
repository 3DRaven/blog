<style>
.gc-views,.gc-total{
  display:flex;align-items:baseline;flex-wrap:wrap;gap:.35em;
  margin:.75em 0 0;color:#828282;font-size:.9em;line-height:1.5;
}
.gc-total{margin:0 0 1.25em;font-size:.95em}
.gc-label{color:#828282}
/* SVG is 200×60: label ~y18, digit ~y48 — show only digit band */
.gc-count{
  display:inline-block;position:relative;
  width:2em;height:1.05em;overflow:hidden;
  flex:0 0 auto;background:#fff;isolation:isolate;
}
.gc-count img{
  position:absolute;left:50%;top:0;
  width:200px;height:60px;max-width:none;border:0;
  /* shift up so only the digit (lower half) sits in the window */
  transform:translate(-50%,-72%) scale(.55);
  transform-origin:center top;
  filter:grayscale(1) contrast(.95) brightness(1.08);
  background:#fff;pointer-events:none;
}
</style>
<script data-goatcounter="https://3draven.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
